name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.env.example'
      - 'rules/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
  schedule:
    - cron: '0 20 * * 0'  # 每周一 04:00 (UTC+8) 自动更新规则
  release:
    types: [published]
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: jeffok
  IMAGE_NAME: mosdns
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build local test image
        run: docker build -t mosdns:v2-test .

      - name: Build smoke test tools image
        run: docker build -f tests/benchmark/Dockerfile -t mosdns:p2-tools .

      - name: Build smoke runner image
        run: docker build -f tests/runner.Dockerfile -t mosdns:v2-runner .

      - name: Run containerized smoke tests
        run: docker run --rm --network host -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:$PWD" -w "$PWD" -e MOSDNS_IMAGE=mosdns:p2-tools mosdns:v2-runner

  build:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set tags
        id: tags
        run: |
          REPO="${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          TAGS="${REPO}:latest"
          TAGS="${TAGS},${REPO}:${GITHUB_SHA::7}"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAGS="${TAGS},${REPO}:${{ github.event.release.tag_name }}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CACHEBUST=${{ github.run_id }}
