name: Build and Push to Harbor

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - 'rules/**'
  workflow_dispatch:

env:
  REGISTRY: reg.jeffok.com:4443
  IMAGE_NAME: jeff/mosdns

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u ${{ secrets.HARBOR_USERNAME }} --password-stdin

      - name: Set tags
        id: tags
        run: |
          REPO="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "repo=${REPO}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push
        run: |
          docker build \
            --build-arg CACHEBUST=${{ github.run_id }} \
            -t ${{ steps.tags.outputs.repo }}:latest \
            -t ${{ steps.tags.outputs.repo }}:${{ steps.tags.outputs.short_sha }} \
            .
          docker push ${{ steps.tags.outputs.repo }}:latest
          docker push ${{ steps.tags.outputs.repo }}:${{ steps.tags.outputs.short_sha }}
