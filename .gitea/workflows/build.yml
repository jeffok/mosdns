name: Build and Push to Harbor

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - 'rules/**'
  workflow_dispatch:

env:
  REGISTRY: reg.jeffok.com:4443
  IMAGE_NAME: jeff/mosdns

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        run: |
          docker buildx create --name mybuilder --use --driver docker-container \
            --driver-opt network=host
          docker buildx inspect --bootstrap

      - name: Login to Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u ${{ secrets.HARBOR_USERNAME }} --password-stdin

      - name: Build and push
        run: |
          REPO="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          docker buildx build \
            --build-arg CACHEBUST=${{ github.run_id }} \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            -t ${REPO}:latest \
            -t ${REPO}:${SHORT_SHA} \
            --push \
            .
          # 轮换缓存目录，避免无限增长
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
